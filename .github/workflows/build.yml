name: Build

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write  # required for gh release upload

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            vcpkg_triplet: x64-linux-static
            tsk_lib: libtsk.a
            binary: build/disk-analysis
            release_asset: disk-analysis-linux-x64

          - os: macos-latest
            name: macos-arm64
            vcpkg_triplet: arm64-osx-static
            tsk_lib: libtsk.a
            binary: build/disk-analysis
            release_asset: disk-analysis-macos-arm64

          - os: windows-latest
            name: windows-x64
            vcpkg_triplet: x64-mingw-static
            tsk_lib: libtsk.a
            binary: build/disk-analysis.exe
            release_asset: disk-analysis-windows-x64.exe

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    env:
      TSK_VERSION: sleuthkit-4.12.1
      TSK_INSTALL: ${{ github.workspace }}/tsk-install

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── MSYS2 (Windows) — provides MinGW compiler + autotools + zlib ───────
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            autoconf
            automake
            libtool
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      # ── vcpkg binary cache ─────────────────────────────────────────────────
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Set up vcpkg binary cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-cache" >> $GITHUB_ENV

      # ── Refresh vcpkg binary (Linux / macOS) ───────────────────────────────
      - name: Bootstrap vcpkg (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      # ── TSK cache ──────────────────────────────────────────────────────────
      - name: Cache TSK
        id: cache-tsk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/tsk-install
          key: tsk-${{ env.TSK_VERSION }}-${{ matrix.name }}

      # ── Platform deps needed before building TSK ───────────────────────────
      - name: Install zlib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zlib1g-dev

      - name: Install TSK build tools (Linux)
        if: runner.os == 'Linux' && steps.cache-tsk.outputs.cache-hit != 'true'
        run: sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Install build tools (macOS)
        if: runner.os == 'macOS' && steps.cache-tsk.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool

      # ── Build TSK from source ──────────────────────────────────────────────
      - name: Clone TSK
        if: steps.cache-tsk.outputs.cache-hit != 'true'
        run: git clone --depth=1 --branch ${{ env.TSK_VERSION }} https://github.com/sleuthkit/sleuthkit.git tsk-src

      - name: Build TSK (Linux / macOS)
        if: runner.os != 'Windows' && steps.cache-tsk.outputs.cache-hit != 'true'
        working-directory: tsk-src
        run: |
          # macOS Clang (and newer GCC/Clang in C11/C17 modes) reject some legacy
          # K&R-style function definitions in bundled hash sources (md5c.c/sha1c.c).
          # At the same time, forcing -std=gnu89 globally breaks newer TSK C code
          # that relies on C99 loop scoping. So: build as GNU99 and patch the few
          # legacy definitions to ANSI C prototypes.
          python3 - <<'PY'
          import re
          from pathlib import Path

          def patch_file(path: Path) -> bool:
            text = path.read_text(encoding='utf-8', errors='ignore')
            original = text

            # Convert known K&R-style definitions into ANSI prototypes.
            # We match the classic reference implementations used by TSK.
            replacements = [
              # sha1c.c
              (r"(?ms)^SHSTransform\s*\(\s*digest\s*,\s*data\s*\)\s*\n\s*UINT4\s+digest\s*\[[^\]]+\]\s*;\s*\n\s*unsigned\s+char\s+data\s*\[[^\]]+\]\s*;\s*\n\s*\{",
               "static void SHSTransform(UINT4 digest[5], unsigned char data[64])\n{",
               "SHSTransform"),

              # md5c.c
              (r"(?ms)^MD5Transform\s*\(\s*state\s*,\s*block\s*\)\s*\n\s*UINT4\s+state\s*\[[^\]]+\]\s*;\s*\n\s*unsigned\s+char\s+block\s*\[[^\]]+\]\s*;\s*\n\s*\{",
               "static void MD5Transform(UINT4 state[4], unsigned char block[64])\n{",
               "MD5Transform"),
              (r"(?ms)^Encode\s*\(\s*output\s*,\s*input\s*,\s*len\s*\)\s*\n\s*unsigned\s+char\s*\*\s*output\s*;\s*\n\s*UINT4\s*\*\s*input\s*;\s*\n\s*unsigned\s+int\s+len\s*;\s*\n\s*\{",
               "static void Encode(unsigned char *output, UINT4 *input, unsigned int len)\n{",
               "Encode"),
              (r"(?ms)^Decode\s*\(\s*output\s*,\s*input\s*,\s*len\s*\)\s*\n\s*UINT4\s*\*\s*output\s*;\s*\n\s*unsigned\s+char\s*\*\s*input\s*;\s*\n\s*unsigned\s+int\s+len\s*;\s*\n\s*\{",
               "static void Decode(UINT4 *output, unsigned char *input, unsigned int len)\n{",
               "Decode"),
              (r"(?ms)^MD5_memcpy\s*\(\s*output\s*,\s*input\s*,\s*len\s*\)\s*\n\s*unsigned\s+char\s*\*\s*output\s*;\s*\n\s*unsigned\s+char\s*\*\s*input\s*;\s*\n\s*unsigned\s+int\s+len\s*;\s*\n\s*\{",
               "static void MD5_memcpy(unsigned char *output, unsigned char *input, unsigned int len)\n{",
               "MD5_memcpy"),
              (r"(?ms)^MD5_memset\s*\(\s*output\s*,\s*value\s*,\s*len\s*\)\s*\n\s*unsigned\s+char\s*\*\s*output\s*;\s*\n\s*int\s+value\s*;\s*\n\s*unsigned\s+int\s+len\s*;\s*\n\s*\{",
               "static void MD5_memset(unsigned char *output, int value, unsigned int len)\n{",
               "MD5_memset"),
            ]

            changed = False
            for pattern, repl, name in replacements:
              new_text, n = re.subn(pattern, repl, text)
              if n:
                text = new_text
                changed = True

            # If a legacy K&R signature is present but we didn't patch it, fail fast
            # so the workflow doesn't proceed with a confusing compiler error.
            kr_markers = [
              "SHSTransform(digest, data)",
              "MD5Transform(state, block)",
              "Encode(output, input, len)",
              "Decode(output, input, len)",
              "MD5_memcpy(output, input, len)",
              "MD5_memset(output, value, len)",
            ]
            if any(m in original for m in kr_markers) and not changed:
              raise SystemExit(f"Found legacy K&R signatures in {path} but patch did not apply")

            if changed and text != original:
              path.write_text(text, encoding='utf-8')
              return True
            return False

          # Patch any matching files wherever they live in the TSK tree.
          targets = []
          for name in ("sha1c.c", "md5c.c"):
            targets.extend(Path('.').rglob(name))

          patched = 0
          for p in targets:
            if patch_file(p):
              patched += 1

          print(f"Patched {patched} file(s)")
          PY

          ./bootstrap
          ./configure \
            CFLAGS="-std=gnu99" \
            --prefix="$TSK_INSTALL" \
            --enable-static \
            --disable-shared \
            --without-openssl \
            --without-libewf \
            --without-afflib \
            --disable-java
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install

      - name: Build TSK (Windows)
        if: runner.os == 'Windows' && steps.cache-tsk.outputs.cache-hit != 'true'
        shell: msys2 {0}
        working-directory: tsk-src
        run: |
          # GCC 14 rejects 'typedef unsigned bool' — stdbool.h already defines bool as _Bool.
          sed -i '/typedef unsigned[[:space:]]*bool;/d' tsk/base/crc.h
          TSK_PREFIX=$(cygpath -u "$TSK_INSTALL")
          ./bootstrap
          ./configure \
            --prefix="$TSK_PREFIX" \
            --enable-static \
            --disable-shared \
            --without-openssl \
            --without-libewf \
            --without-afflib \
            --disable-java
          make -j$(nproc)
          make install

      # ── Configure & build ──────────────────────────────────────────────────
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DVCPKG_OVERLAY_TRIPLETS=cmake/triplets \
            -DTSK_INCLUDE_DIR="$TSK_INSTALL/include" \
            -DTSK_LIBRARY="$TSK_INSTALL/lib/${{ matrix.tsk_lib }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DTSK_INCLUDE_DIR="$TSK_INSTALL/include" \
            -DTSK_LIBRARY="$TSK_INSTALL/lib/libtsk.a" \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++"

      - name: Build
        run: cmake --build build --config Release

      # ── Artifacts & release assets ─────────────────────────────────────────
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-analysis-${{ matrix.name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

      - name: Attach to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ matrix.binary }}" "${{ matrix.release_asset }}"
          gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.release_asset }}"
